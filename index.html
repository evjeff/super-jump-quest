<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Jump Quest</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #12121c;
        color: #e8e8f0;
        font-family: ui-monospace, "Cascadia Code", "Source Code Pro", monospace;
      }
      #game {
        line-height: 0;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgb(0 0 0 / 55%);
      }
      #game canvas {
        max-width: 100%;
        height: auto;
      }
      footer {
        font-size: 13px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <footer>
      Arrows or WASD to move &middot; Space to jump, twice more in mid-air for a triple jump
      &middot; N for the next level &middot; R to start over
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
